name: Global TV Broadcast Engine

on:
  workflow_dispatch:
    inputs:
      yt_url:
        description: 'YouTube Live Link'
        required: true
      fb_key:
        description: 'Facebook Stream Key'
        required: true
      news_tagline:
        description: 'News Tagline'
        required: false
        default: 'BREAKING NEWS'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install FFmpeg & Latest Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
        sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp

    - name: Start Broadcast
      env:
        YT_LINK: ${{ github.event.inputs.yt_url }}
        FB_KEY: ${{ github.event.inputs.fb_key }}
        TAGLINE: ${{ github.event.inputs.news_tagline }}
      run: |
        if [ -z "$YT_LINK" ] || [ -z "$FB_KEY" ]; then
          echo "ERROR: YouTube URL or Facebook Stream Key is missing!"
          exit 1
        fi

        FB_TARGET="rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"

        # Get direct HLS live stream URL
        STREAM_URL=$(yt-dlp -g -f best "$YT_LINK" | head -n 1)

        if [ -z "$STREAM_URL" ]; then
          echo "ERROR: Could not fetch stream URL from YouTube. Video might be private or ended."
          exit 1
        fi

        ffmpeg -re -i "$STREAM_URL" -i logo.png \
        -filter_complex "[0:v][1:v]overlay=15:15[v1]; \
        [v1]drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf: \
        text=' LIVE':x=160:y=20:fontsize=22:fontcolor=white:box=1:boxcolor=red@0.9:boxborderw=5[v2]; \
        [v2]drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf: \
        text='%{localtime\:%I\:%M\:%S %p}':x=w-tw-20:y=20:fontsize=22:fontcolor=white:box=1:boxcolor=black@0.6:boxborderw=5[v3]; \
        [v3]drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf: \
        text=' ${TAGLINE} ':x=(w-tw)/2:y=h-50:fontsize=26:fontcolor=yellow:box=1:boxcolor=black@0.8:boxborderw=8[outv]" \
        -map "[outv]" -map 0:a? \
        -vcodec libx264 -preset ultrafast -b:v 3000k -maxrate 3000k -bufsize 6000k \
        -acodec aac -b:a 128k -ar 44100 \
        -f flv "$FB_TARGET"
