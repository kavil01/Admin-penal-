<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global TV Broadcast Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            border: 1px solid #334155;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 1.5rem;
        }

        p.subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-start { background-color: #22c55e; color: #ffffff; }
        .btn-stop { background-color: #ef4444; color: #ffffff; }
        .btn-save { background-color: #3b82f6; color: #ffffff; }
        .btn-clear { background-color: #64748b; color: #ffffff; }
        .btn-login { background-color: #38bdf8; color: #0f172a; width: 100%; margin-top: 10px; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. LOGIN FORM -->
    <div id="loginSection" class="card">
        <h2>📺 STUDIO LOGIN</h2>
        <p class="subtitle">Access Control System</p>
        
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter Username">
        </div>
        
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter Password">
        </div>

        <button class="btn-login" onclick="checkLogin()">LOGIN</button>
    </div>

    <!-- 2. ADMIN CONTROL PANEL -->
    <div id="adminSection" class="card hidden">
        <h2>📺 GLOBAL TV BROADCAST STUDIO</h2>
        <p class="subtitle">Cloud Relaying System</p>

        <div class="form-group">
            <label>GitHub Token (Default Set):</label>
            <!-- கீழே value-க்குள் உங்கள் Token-ஐ இடவும் -->
            <input type="password" id="patToken" value="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">
        </div>

        <div class="form-group">
            <label>Source YouTube Live URL:</label>
            <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=XXXXXX">
        </div>

        <div class="form-group">
            <label>Facebook Stream Key (Default Set):</label>
            <!-- கீழே value-க்குள் உங்கள் FB Key-ஐ இடவும் -->
            <input type="password" id="fbKey" value="FB-1948535219149229-0-Ab5n8O7kCaBlL91T2GgvkUtX">
        </div>

        <div class="form-group">
            <label>Breaking News Tagline Text:</label>
            <input type="text" id="newsTagline" value="BREAKING NEWS">
        </div>

        <!-- SAVE & CLEAR BUTTONS -->
        <div class="btn-group">
            <button class="btn-save" onclick="saveData()">💾 SAVE DETAILS</button>
            <button class="btn-clear" onclick="clearData()">🗑 CLEAR LINK ONLY</button>
        </div>

        <!-- START & STOP LIVE BUTTONS -->
        <div class="btn-group">
            <button class="btn-start" onclick="startLive()">▶ START GLOBAL LIVE</button>
            <button class="btn-stop" onclick="stopLive()">⏹ STOP LIVE</button>
        </div>
    </div>

    <!-- 3. JAVASCRIPT ENGINE -->
    <script>
        const GITHUB_USER = "kavil01";
        const GITHUB_REPO = "Admin-penal-";
        const WORKFLOW_FILE = "tv-studio.yml";

        // Login Check & Load Saved Data
        function checkLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            if (user === "Kavil" && pass === "Kavil123") {
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("adminSection").classList.remove("hidden");
                loadSavedData();
            } else {
                alert("தவறான Username அல்லது Password!");
            }
        }

        // Save Data to LocalStorage
        function saveData() {
            localStorage.setItem("tv_patToken", document.getElementById("patToken").value.trim());
            localStorage.setItem("tv_ytUrl", document.getElementById("ytUrl").value.trim());
            localStorage.setItem("tv_fbKey", document.getElementById("fbKey").value.trim());
            localStorage.setItem("tv_newsTagline", document.getElementById("newsTagline").value.trim());
            alert("✅ அனைத்து தகவல்களும் சேமிக்கப்பட்டன!");
        }

        // Load Saved Data
        function loadSavedData() {
            if (localStorage.getItem("tv_patToken")) document.getElementById("patToken").value = localStorage.getItem("tv_patToken");
            if (localStorage.getItem("tv_ytUrl")) document.getElementById("ytUrl").value = localStorage.getItem("tv_ytUrl");
            if (localStorage.getItem("tv_fbKey")) document.getElementById("fbKey").value = localStorage.getItem("tv_fbKey");
            if (localStorage.getItem("tv_newsTagline")) document.getElementById("newsTagline").value = localStorage.getItem("tv_newsTagline");
        }

        // Clear YouTube Link Only
        function clearData() {
            localStorage.removeItem("tv_ytUrl");
            document.getElementById("ytUrl").value = "";
            alert("🗑 YouTube Link மட்டும் நீக்கப்பட்டது!");
        }

        // Start Live Action
        async function startLive() {
            const token = document.getElementById("patToken").value.trim();
            const ytUrl = document.getElementById("ytUrl").value.trim();
            const fbKey = document.getElementById("fbKey").value.trim();
            const newsText = document.getElementById("newsTagline").value.trim() || "BREAKING NEWS";

            if (!token || !ytUrl || !fbKey) {
                alert("தயவுசெய்து YouTube Link-ஐ உள்ளிடவும்!");
                return;
            }

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`;

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        ref: "main",
                        inputs: {
                            yt_url: ytUrl,
                            fb_key: fbKey,
                            news_tagline: newsText
                        }
                    })
                });

                if (response.ok) {
                    alert("🔴 LIVE BROADCAST IS ON AIR! (1-2 நிமிடங்களில் நேரலை தொடங்கும்)");
                } else {
                    const errorData = await response.json();
                    alert("பிழை ஏற்பட்டது: " + (errorData.message || "Token அனுமதியை சரிபார்க்கவும்."));
                }
            } catch (err) {
                alert("Network Error: " + err.message);
            }
        }

        // Stop Running Broadcast
        async function stopLive() {
            const token = document.getElementById("patToken").value.trim();

            if (!token) {
                alert("GitHub Token காணப்படவில்லை!");
                return;
            }

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/runs`;

            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });
                const data = await response.json();
                const activeRun = data.workflow_runs.find(run => run.status === "in_progress" || run.status === "queued");

                if (activeRun) {
                    await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/runs/${activeRun.id}/cancel`, {
                        method: "POST",
                        headers: {
                            "Authorization": `token ${token}`,
                            "Accept": "application/vnd.github.v3+json"
                        }
                    });
                    alert("⏹ LIVE BROADCAST STOPPED!");
                } else {
                    alert("தற்போது எந்த நேரலையும் இயங்கவில்லை.");
                }
            } catch (err) {
                alert("Error cancelling workflow: " + err.message);
            }
        }
    </script>
</body>
</html>
